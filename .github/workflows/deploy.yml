name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment password
        env:
          VITE_APP_PASSWORD: ${{ secrets.VITE_APP_PASSWORD }}
        run: |
          if [ -z "$VITE_APP_PASSWORD" ]; then
            echo "VITE_APP_PASSWORD secret is required for GitHub Pages deployment."
            exit 1
          fi

      - name: Build
        env:
          VITE_APP_PASSWORD: ${{ secrets.VITE_APP_PASSWORD }}
        run: npm run build

      - name: List build output
        run: |
          echo "=== Build directory contents ==="
          ls -la ./build/
          echo "=== index.html content ==="
          cat ./build/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./build"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4